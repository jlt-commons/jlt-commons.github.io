name: Site

# Builds the organization site on every pull request, and publishes it to
# GitHub Pages from main. The generator lives in jlt-commons/docs-engine,
# shared with every project site; this repo owns its content in docs/, its
# config in docs/site.edn, and its homepage template.
#
# The engine is pinned to a tag rather than tracking its main branch, so a
# change over there cannot take this site down without someone choosing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to build with for this run (blank uses the JOLT_VERSION pin)"
        required: false
        default: ""

permissions:
  contents: read

# Deploys must not race, and a half-applied Pages deployment is worse than
# a slightly stale one, so main is never cancelled. Pull request builds are
# scoped per ref and cancel their own earlier runs, so a third queued run
# cannot supersede a second one and show a contributor a cancelled check.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # v0.4.8 adds the :nav-links setting, which puts Fleet in the nav.
  # v0.4.4-v0.4.7 add README images and alert callouts, fix table code
  # wrapping, and bump the dependencies. v0.4.8 also runs on jolt only.
  # v0.4.3 escapes a bare < the way GitHub does.
  # v0.4.2 closes search on Tab-out and titles untitled pages by slug.
  # v0.4.1 fixes search-hit styling; v0.4.0 added nav search.
  # v0.3.2 fixes `jolt run build`/`clean` (docs-engine#3); v0.3.1 added
  # heading anchors.
  DOCS_ENGINE_REF: v0.4.8
  # jolt is pinned like every project's JOLT_VERSION (see ci-builds' README,
  # "The pin convention"), so a jolt release cannot turn this site red on a
  # tree nobody touched, and the build makes no API call to resolve latest.
  # A dispatch can try another release without a commit. 0.8.24 is the
  # oldest jolt the engine's jolt-lang/time dependency runs on.
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.27' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 ships on ubuntu-latest, so no setup-node. These cover the
      # pure functions behind docs/fleet/, which is copied to the site as-is.
      - name: Test the fleet page
        run: node --test test/*.test.mjs

      - name: Check out the docs engine
        uses: actions/checkout@v7
        with:
          repository: jlt-commons/docs-engine
          ref: ${{ env.DOCS_ENGINE_REF }}
          path: .docs-engine

      - name: Install jolt
        uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.JOLT_VERSION }}

      - name: Build
        working-directory: .docs-engine
        run: jolt run build "$GITHUB_WORKSPACE"

      - name: Check the build
        run: |
          set -euo pipefail
          out=_site

          test -f "$out/index.html"       || { echo "no homepage generated"; exit 1; }
          test -f "$out/guide/index.html" || { echo "no guide page generated"; exit 1; }
          test -f "$out/css/screen.css"   || { echo "static assets missing"; exit 1; }
          test -f "$out/img/mark.svg"     || { echo "the mark was not copied — check :asset-dirs"; exit 1; }
          test -f "$out/fleet/index.html" && test -f "$out/fleet/fleet.js" \
            && test -f "$out/fleet/deps.html" && test -f "$out/fleet/deps.js" \
            || { echo "the fleet page was not copied — check :asset-dirs"; exit 1; }

          ! grep -rq '{{site-base}}' "$out"/index.html "$out"/guide/*.html \
            || { echo "unrendered template variable"; exit 1; }

          # This site is served at the domain ROOT, so its URLs are correctly
          # root-absolute. That is the opposite of a project site, where a bare
          # /css/... would resolve here instead of inside the project. The
          # check that belongs here is that no project's base path leaked in.
          # js/ arrived with docs-engine v0.4.0's search.js. fleet/ is this site's own page.
          if grep -ohE '(href|src)="/[a-z-]+/' "$out"/index.html "$out"/guide/*.html \
               | sort -u | grep -vE '="/(css|img|guide|vendor|js|fleet)/'; then
            echo "the paths above are not this site's own"
            exit 1
          fi

          # The engine loads mermaid only where a diagram exists. This site has
          # none, and the bundle is 3.4 MB, so its appearance means the gating
          # regressed rather than that someone added a diagram — which would
          # also need this line updated, deliberately.
          ! grep -rq 'mermaid.min.js' "$out"/index.html "$out"/guide/*.html \
            || { echo "mermaid loaded on a site with no diagrams"; exit 1; }

          echo "build looks correct"

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
