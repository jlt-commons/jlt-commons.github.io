name: Site

# Builds the organization site on every pull request, and publishes it to
# GitHub Pages from main. The generator lives in jlt-commons/docs-engine,
# shared with every project site; this repo owns its content in docs/, its
# config in docs/site.edn, and its homepage template.
#
# The engine is pinned to a tag rather than tracking its main branch, so a
# change over there cannot take this site down without someone choosing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not race, and a half-applied Pages deployment is worse than
# a slightly stale one, so main is never cancelled. Pull request builds are
# scoped per ref and cancel their own earlier runs, so a third queued run
# cannot supersede a second one and show a contributor a cancelled check.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCS_ENGINE_REF: v0.2.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the docs engine
        uses: actions/checkout@v7
        with:
          repository: jlt-commons/docs-engine
          ref: ${{ env.DOCS_ENGINE_REF }}
          path: .docs-engine

      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Build
        working-directory: .docs-engine
        run: bb build "$GITHUB_WORKSPACE"

      - name: Check the build
        run: |
          set -euo pipefail
          out=_site

          test -f "$out/index.html"       || { echo "no homepage generated"; exit 1; }
          test -f "$out/guide/index.html" || { echo "no guide page generated"; exit 1; }
          test -f "$out/css/screen.css"   || { echo "static assets missing"; exit 1; }
          test -f "$out/img/mark.svg"     || { echo "the mark was not copied — check :asset-dirs"; exit 1; }

          ! grep -rq '{{site-base}}' "$out"/index.html "$out"/guide/*.html \
            || { echo "unrendered template variable"; exit 1; }

          # This site is served at the domain ROOT, so its URLs are correctly
          # root-absolute. That is the opposite of a project site, where a bare
          # /css/... would resolve here instead of inside the project. The
          # check that belongs here is that no project's base path leaked in.
          if grep -ohE '(href|src)="/[a-z-]+/' "$out"/index.html "$out"/guide/*.html \
               | sort -u | grep -vE '="/(css|img|guide|vendor)/'; then
            echo "the paths above are not this site's own"
            exit 1
          fi

          # The engine loads mermaid only where a diagram exists. This site has
          # none, and the bundle is 3.4 MB, so its appearance means the gating
          # regressed rather than that someone added a diagram — which would
          # also need this line updated, deliberately.
          ! grep -rq 'mermaid.min.js' "$out"/index.html "$out"/guide/*.html \
            || { echo "mermaid loaded on a site with no diagrams"; exit 1; }

          echo "build looks correct"

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
