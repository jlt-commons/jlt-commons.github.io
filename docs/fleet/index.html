<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) { /* storage blocked: follow the OS */ }
      var theme = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Whether each jlt-commons project builds against its own pinned jolt, jolt's latest release and jolt's nightly.">
  <title>Fleet status - jlt-commons</title>
  <link rel="stylesheet" href="/css/screen.css">
  <style>
    :root {
      --ok: #3fb950; --bad: #f85149; --warn: #d29922; --muted: #8b96a3;
      --warn-bg: #3a2a05;
    }
    :root[data-theme="light"] {
      --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700; --muted: #59636e;
      --warn-bg: #fff8c5;
    }
    .fleet { max-width: 62rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
    .fleet h1 { margin: 0 0 0.5rem; }
    .fleet .lede { color: var(--text-dim); margin: 0 0 1.5rem; }
    .dim { color: var(--text-dim); }
    .fleet-warn { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: var(--radius);
                  padding: 0.75rem 1rem; margin: 0 0 1rem; }
    .fleet-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.75rem 1.5rem; margin: 0 0 1.5rem; }
    .fleet-meta dt { font-size: 0.8rem; color: var(--text-dim); }
    .fleet-meta dd { margin: 0; }
    .grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    .fleet-grid { border-collapse: collapse; width: 100%; min-width: 40rem; }
    .fleet-grid th, .fleet-grid td { text-align: left; vertical-align: top; padding: 0.6rem 0.75rem;
                                     border-bottom: 1px solid var(--border); }
    .fleet-grid thead th { background: var(--bg-raised); font-size: 0.85rem; }
    .fleet-grid tbody tr:last-child > * { border-bottom: 0; }
    .res { display: inline-block; font-weight: 600; border-left: 4px solid var(--muted); padding-left: 0.5rem; }
    .res a { color: inherit; }
    .res-pass { border-color: var(--ok); }
    .res-fail, .res-mismatch { border-color: var(--bad); }
    .res-infra, .res-timed-out, .res-dispatch-failed { border-color: var(--warn); }
    .ver { display: block; font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); padding-left: 0.75rem; }
    .note { display: block; font-size: 0.8rem; font-weight: 400; color: var(--warn); }
    .hist-box { font-weight: 400; margin-top: 0.4rem; }
    .hist-box summary { cursor: pointer; font-size: 0.8rem; color: var(--text-dim); }
    .hist-cols { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem; }
    .hist-cols h4 { margin: 0 0 0.25rem; font-size: 0.8rem; }
    .hist { margin: 0; padding-left: 1.2rem; font-size: 0.8rem; }
    .hist .res { font-weight: 400; }
    .fleet-uncovered { margin-top: 2rem; }
    .fleet-uncovered ul { columns: 16rem; padding-left: 1.2rem; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="inner">
      <a href="/" class="brand">jlt-commons</a>
      <ul class="links">
        <li><a href="/">Home</a></li>
        <li class="selected"><a href="/fleet/">Fleet</a></li>
        <li><a href="https://github.com/jlt-commons" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="fleet">
    <h1>Fleet status</h1>
    <p class="lede">Each project is built against the jolt it pins, jolt's latest release and jolt's nightly, so a new jolt that breaks something shows up here first. Failing projects come first.</p>
    <div id="fleet-root" aria-live="polite"><p class="dim">Loading.</p></div>
    <noscript><p class="fleet-warn">This page needs JavaScript to load the build results.</p></noscript>
  </main>

  <script type="module">
    import { loadAndRender } from "./fleet.js";
    loadAndRender(document.getElementById("fleet-root"));
  </script>
</body>
</html>
